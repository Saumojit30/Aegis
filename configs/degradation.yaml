# Aegis Degradation Scenarios (D0 - D7)
# Single source of truth for stress-testing forecaster reliability

scenarios:
  D0:
    scenario_id: "D0"
    description: "Nominal: continuous CGM, complete wearables, known meal macros"
    simulated_dropout_probability: 0.0
    cgm_staleness_threshold_min: 5
    wearable_missing: false

  D1:
    scenario_id: "D1"
    description: "Wearables missing: HR and METs sensors disconnected"
    simulated_dropout_probability: 0.0
    cgm_staleness_threshold_min: 5
    wearable_missing: true

  D2:
    scenario_id: "D2"
    description: "CGM intermittent dropout: 15-minute gap prior to meal start"
    simulated_dropout_probability: 0.2
    cgm_staleness_threshold_min: 15
    wearable_missing: false

  D3:
    scenario_id: "D3"
    description: "Stale CGM: last reading is 30 minutes old"
    simulated_dropout_probability: 0.0
    cgm_staleness_threshold_min: 30
    wearable_missing: false

  D4:
    scenario_id: "D4"
    description: "Severe CGM dropout: last reading is 60 minutes old"
    simulated_dropout_probability: 0.5
    cgm_staleness_threshold_min: 60
    wearable_missing: false

  D5:
    scenario_id: "D5"
    description: "Unknown meal composition: only meal timing recorded"
    simulated_dropout_probability: 0.0
    cgm_staleness_threshold_min: 5
    wearable_missing: false

  D6:
    scenario_id: "D6"
    description: "New patient cold start: 0 personal meals logged"
    simulated_dropout_probability: 0.0
    cgm_staleness_threshold_min: 5
    wearable_missing: false

  D7:
    scenario_id: "D7"
    description: "Combined stress: missing wearables + stale CGM + high-carb meal"
    simulated_dropout_probability: 0.3
    cgm_staleness_threshold_min: 30
    wearable_missing: true
